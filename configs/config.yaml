# ==============================================================================
# SE4050 Deep Learning 2026 — Global Configuration
# Fair Experimental Conditions Protocol for Food-101 Classification
# ==============================================================================

project:
  name: "food-classification-deep-learning"
  module: "SE4050 - Deep Learning"
  institution: "SLIIT"
  academic_year: 2026
  seed: 42

dataset:
  name: "Food-101"
  source_url: "https://data.vision.ee.ethz.ch/cvl/datasets_extra/food-101/"
  num_classes: 101
  total_images: 101000
  original_train_count: 75750
  original_test_count: 25250
  # Canonical split: 90% train (~68,175), 10% val (~7,575) from original 75,750 train set
  validation_split_ratio: 0.10
  raw_dir: "data/raw/food-101"
  processed_dir: "data/processed"
  splits_dir: "data/splits"

image:
  target_size: [224, 224]
  channels: 3
  interpolation: "bilinear"

augmentation:
  train_only: true
  horizontal_flip: true
  rotation_factor: 0.05       # Slight rotation (+/- 18 degrees)
  zoom_height_factor: 0.10    # Subtle vertical zoom
  zoom_width_factor: 0.10     # Subtle horizontal zoom

preprocessing:
  custom_cnn: "rescale_0_1"                   # 1./255 scaling
  resnet50: "caffe_bgr_mean_subtraction"      # tf.keras.applications.resnet50.preprocess_input
  mobilenetv2: "normalize_neg1_to_pos1"       # tf.keras.applications.mobilenet_v2.preprocess_input
  efficientnetb0: "native_pass_through"       # tf.keras.applications.efficientnet.preprocess_input

benchmark:
  candidate_batch_sizes: [16, 32, 64]
  selected_batch_size: 32     # Feasibility default; verified via GPU benchmark
  sample_epochs: 1

training:
  epochs: 25
  optimizer: "adam"
  learning_rate: 0.001
  early_stopping:
    monitor: "val_loss"
    patience: 5
    restore_best_weights: true
  reduce_lr:
    monitor: "val_loss"
    factor: 0.2
    patience: 3
    min_lr: 0.00001

evaluation:
  metrics:
    - "accuracy"
    - "top_5_accuracy"
    - "precision_macro"
    - "precision_weighted"
    - "recall_macro"
    - "recall_weighted"
    - "f1_macro"
    - "f1_weighted"
    - "confusion_matrix"
  computational_benchmarks:
    - "total_parameters"
    - "trainable_parameters"
    - "model_size_mb"
    - "inference_latency_ms"
    - "training_time_seconds"
